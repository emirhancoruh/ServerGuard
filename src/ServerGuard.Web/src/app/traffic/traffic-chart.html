<header class="section-header">
  <h2>Trafik</h2>
  <span class="subtitle">son {{ windowMinutes }} dakika</span>
</header>

@switch (state()) {
  @case ('loading') {
    <p class="status status--loading">Trafik verisi yükleniyor…</p>
  }
  @case ('error') {
    <div class="status status--error">
      <p>Trafik verisi yüklenemedi.</p>
      <button type="button" (click)="reload()">Yeniden dene</button>
    </div>
  }
  @default {
    @if (points().length === 0) {
      <p class="status">Bu aralıkta trafik kaydı yok.</p>
    } @else {
      <dx-chart [dataSource]="points()">
        <dxi-series
          type="stackedarea"
          argumentField="timestamp"
          valueField="successCount"
          name="2xx"
          color="#37b24d">
          <dxo-point [visible]="false"></dxo-point>
        </dxi-series>
        <dxi-series
          type="stackedarea"
          argumentField="timestamp"
          valueField="clientErrorCount"
          name="4xx"
          color="#f08c00">
          <dxo-point [visible]="false"></dxo-point>
        </dxi-series>
        <dxi-series
          type="stackedarea"
          argumentField="timestamp"
          valueField="serverErrorCount"
          name="5xx"
          color="#e03131">
          <dxo-point [visible]="false"></dxo-point>
        </dxi-series>
        <dxo-argument-axis argumentType="datetime">
          <dxo-label format="HH:mm"></dxo-label>
        </dxo-argument-axis>
        <dxi-value-axis [allowDecimals]="false">
          <dxo-title text="İstek sayısı"></dxo-title>
        </dxi-value-axis>
        <dxo-legend [visible]="true" verticalAlignment="top" horizontalAlignment="right"></dxo-legend>
        <dxo-tooltip [enabled]="true"></dxo-tooltip>
        <dxo-common-series-settings [ignoreEmptyPoints]="false"></dxo-common-series-settings>
      </dx-chart>
    }
  }
}
